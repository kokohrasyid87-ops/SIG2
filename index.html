<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIG Pertanian & Monitoring Risiko</title>

  <!-- CSS Leaflet & Leaflet Draw via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <!-- Tailwind CSS via CDN (untuk class seperti bg-gray-100, w-full, dll) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS Custom Kita -->
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="w-screen h-screen overflow-hidden m-0 p-0 bg-gray-100">

  <div id="app" class="relative w-screen h-screen overflow-hidden flex">
    
    <div id="map" class="absolute inset-0 w-full h-full z-10"></div>

    <button type="button" id="btn-open-floating" class="md:hidden fixed right-0 top-1/2 -translate-y-1/2 z-[2000] bg-green-600 text-white py-3 px-1.5 rounded-l-lg shadow-2xl text-xs font-bold writing-mode-vertical transition-all flex items-center justify-center">
      📂 Buka Form
    </button>

    <div id="sidebar" class="fixed md:relative top-0 right-0 h-full w-[360px] max-w-[85vw] md:w-[420px] bg-white overflow-y-auto z-30 shadow-2xl p-4 transition-transform duration-300 transform translate-x-0">
      
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-200">
        <h2 class="text-lg font-bold text-gray-800">🌾 Form Input Lahan</h2>
        <button type="button" id="btn-toggle-sidebar" class="md:hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-2.5 py-1 rounded-md text-xs font-semibold shadow-sm transition">
          ▶ Tutup
        </button>
      </div>
      
      <form id="lahan-form" class="space-y-4">
        <fieldset class="border border-gray-300 p-3 rounded-lg bg-gray-50 space-y-3">
          <legend class="font-semibold text-sm text-gray-700 px-2">Data Wilayah & Poktan</legend>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Kecamatan:</label>
            <input type="text" id="kecamatan" placeholder="Contoh: Sukamakmur" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Desa:</label>
            <input type="text" id="desa" placeholder="Nama Desa" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Kelompok Tani (Poktan):</label>
            <input type="text" id="poktan" placeholder="Nama Poktan" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nama Petani:</label>
            <input type="text" id="petani" placeholder="Nama Pemilik Lahan" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white" />
          </div>
        </fieldset>

        <fieldset class="border border-gray-300 p-3 rounded-lg bg-gray-50 space-y-3">
          <legend class="font-semibold text-sm text-gray-700 px-2">Data Agronomi</legend>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Luas Lahan (Otomatis):</label>
            <input type="text" id="luas-display" readonly placeholder="Gambar polygon di peta" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-gray-100 text-gray-600" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Jenis Tanaman:</label>
            <select id="jenis-tanaman" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white">
              <option value="Padi">Padi</option>
              <option value="Jagung">Jagung</option>
              <option value="Kedelai">Kedelai</option>
              <option value="Tebu">Tebu</option>
              <option value="Tembakau">Tembakau</option>
              <option value="Terong">Terong</option>
              <option value="Cabe">Cabe</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Umur Tanaman (Hari):</label>
            <input type="number" id="umur-tanaman" placeholder="Contoh: 45" min="0" required class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white" />
          </div>
        </fieldset>

        <fieldset class="border border-gray-300 p-3 rounded-lg bg-gray-50 space-y-3">
          <legend class="font-semibold text-sm text-gray-700 px-2">Monitoring OPT & DPI</legend>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Status OPT:</label>
            <select id="status-opt" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white">
              <option value="Aman">Aman / Tidak Ada</option>
              <option value="Serangan Ringan">Serangan Ringan</option>
              <option value="Serangan Sedang">Serangan Sedang</option>
              <option value="Serangan Berat">Serangan Berat / Puso</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Status DPI:</label>
            <select id="status-dpi" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white">
              <option value="Aman">Aman / Normal</option>
              <option value="Potensi Kekeringan">Potensi Kekeringan</option>
              <option value="Terendam Banjir">Terendam / Kebanjiran</option>
            </select>
          </div>
        </fieldset>

        <button type="submit" id="btn-simpan" class="w-full bg-green-600 text-white font-semibold py-2.5 px-4 rounded-md text-sm shadow transition disabled:bg-gray-300 disabled:cursor-not-allowed" disabled>
          Simpan Data Lahan
        </button>
      </form>

      <div class="mt-4 flex flex-col gap-2">
        <button type="button" id="btn-export" class="w-full bg-emerald-600 text-white font-medium py-2 px-3 rounded-md text-xs shadow transition">
          📤 Ekspor Data Lahan (.geojson)
        </button>
        <input type="file" id="input-import-json" accept=".geojson,.json" class="hidden">
        <button type="button" id="btn-import" onclick="document.getElementById('input-import-json').click()" class="w-full bg-blue-600 text-white font-medium py-2 px-3 rounded-md text-xs shadow transition">
          📁 Impor Data JSON
        </button>
      </div>

      <div id="rekap-panel" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-sm">
        <h3 class="font-bold text-gray-700 mb-2 text-sm">📊 Rekapitulasi</h3>
        <p class="text-xs text-gray-600 mb-1">Total Lahan Terdata: <strong id="rekap-total-lahan" class="text-gray-800">0</strong> Ha</p>
        <p class="text-xs text-gray-600 mb-1">Total Terdampak OPT: <strong id="rekap-opt" class="text-red-600">0</strong> Ha</p>
        <p class="text-xs text-gray-600 mb-1">Total Terdampak DPI: <strong id="rekap-dpi" class="text-orange-600">0</strong> Ha</p>
      </div>
    </div>

  </div>

  <!-- CDN Leaflet, Leaflet Draw, Turf.js (Urutan Penting: Leaflet dulu!) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <!-- JS Custom Kita (Tanpa type="module") -->
  <script src="./src/main.js"></script>
</body>
</html>
